# Analyze and test every push to main and every pull request.
#
# Before this, only a release tag ran the suite, so main could sit broken until
# the day somebody tried to ship it, with a week of unrelated commits to bisect.
#
# Pull requests opened by other workflows, such as the seasons refresh, do not
# trigger this: GitHub does not start workflows for events caused by the workflow
# token. Those workflows run their own checks for that reason.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned to the same version as release-apk.yml. A floating version would
      # let an upstream Flutter release turn main red with no commit to blame,
      # and would stop this job from saying anything about the release build.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Sync the bundled asset
        run: |
          set -euo pipefail
          mkdir -p app/assets/data
          cp data/provinces.json app/assets/data/provinces.json

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test
