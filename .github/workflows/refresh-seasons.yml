# Re-scrape Ontario hunting seasons from the regulations summary and open a PR.
#
# Ontario publishes no seasons API, so the pack is built by parsing the open
# season tables on ontario.ca. The result is never pushed straight to main:
# hunters act on these dates, so a human reviews the diff first.
#
# Schedule: mid-March, when the new summary is published, and again on 1 August
# as a backstop before the fall season.
# On-demand: Actions -> Refresh hunting seasons -> Run workflow
#
# Opening a pull request needs "Allow GitHub Actions to create and approve pull
# requests" under Settings -> Actions -> General. Without it the scrape succeeds,
# the branch is pushed, and only the last step fails — which is how this went
# unnoticed until somebody ran it on purpose.

name: Refresh hunting seasons

on:
  workflow_dispatch:
    inputs:
      year:
        description: Regulation year the summary covers (season starts spring of this year)
        required: true
        default: "2026"
        type: string
  schedule:
    # Mid-March, after Ontario publishes the updated summary for the new year.
    - cron: "0 14 15 3 *"
    # And again before the fall season, because one run a year is one chance a
    # year. A March run that failed, or that ran before Ontario published, is
    # otherwise not noticed until somebody is reading dates they intend to hunt
    # on. Both runs target the same regulation year, so this is a re-scrape
    # rather than a different question: if March already landed and nothing has
    # changed since, it opens nothing.
    - cron: "0 14 1 8 *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-seasons
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Ontario seasons
        id: scrape
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          YEAR="${{ github.event.inputs.year || '' }}"
          if [ -z "$YEAR" ]; then
            # Scheduled runs target the regulation year that starts this spring.
            YEAR="$(date -u +%Y)"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          python tools/gis/scrape_seasons_on.py --year "$YEAR" | tee scrape.log
          echo 'summary<<EOF' >> "$GITHUB_OUTPUT"
          cat scrape.log >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
          rm scrape.log

      # The scraper stamps `generated` on every run, so an unchanged summary still
      # leaves a diff and still opened a pull request. That is worse than noise: a
      # reviewer who has waved through four one-line date bumps is a reviewer who
      # waves through the fifth, and the fifth is the one that moves the opening
      # day of a season. The point of sending these to a human is lost if most of
      # them say nothing.
      #
      # The cost, stated plainly: `generated` stays at the last date the content
      # actually changed, and the Seasons tab shows it as "read <date>", so the app
      # will understate when the summary was last checked. That claim stays true —
      # it was read then and did say this — and erring toward looking older than we
      # are is the safe direction for a freshness signal.
      - name: Discard a re-scrape that only moved the date
        run: |
          set -euo pipefail
          CHANGED="$(git diff -U0 -- data/on/seasons \
            | grep -E '^[+-][^+-]' \
            | grep -v '"generated"' || true)"
          if [ -n "$(git status --porcelain -- data/on/seasons)" ] \
             && [ -z "$CHANGED" ]; then
            echo "Summary unchanged; only the generated stamp moved. Discarding."
            git checkout -- data/on/seasons
          fi

      # The pull request below is made with the workflow token, and GitHub does not
      # start other workflows for events that token causes, so nothing else will
      # ever check it. The reviewer is left comparing dates by eye, while the app's
      # parser would quietly turn a malformed date into 1970 and an unknown
      # residency into "Resident". Holding the scrape to what the app can actually
      # word has to happen here, before a pull request exists to be waved through.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Check the scrape is something the app can show correctly
        run: |
          set -euo pipefail
          mkdir -p app/assets/data
          cp data/provinces.json app/assets/data/provinces.json
          cd app
          flutter pub get
          flutter test test/seasons_data_test.dart

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/refresh-seasons-${{ steps.scrape.outputs.year }}
          title: "Refresh Ontario hunting seasons (${{ steps.scrape.outputs.year }})"
          commit-message: "data(on): refresh ${{ steps.scrape.outputs.year }} hunting seasons"
          add-paths: data/on/seasons
          delete-branch: true
          body: |
            Re-scraped from the [Ontario Hunting Regulations Summary](https://www.ontario.ca/document/ontario-hunting-regulations-summary).

            **Review the diff against the official tables before merging.**
            Pay attention to any `WARN` lines below: they mean a WMU token in a
            regulation table did not match the mapped WMU list, so those rows
            were dropped.

            ```
            ${{ steps.scrape.outputs.summary }}
            ```

            After merging, run **Rebuild geometry packs** with publish enabled
            so the new seasons ship in `packs-latest`.
